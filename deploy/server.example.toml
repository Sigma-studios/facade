# /etc/facade/server.toml — every key is optional.

# Address other nodes use to reach this server. Needed before `facade node add`.
public_host = "203.0.113.10"

# data_dir = "/var/lib/facade"
# node_listen = "0.0.0.0:7700"    # agents connect here
# api_listen = "0.0.0.0:7701"     # CLI (self-signed, fingerprint-pinned)
# http_listen = "0.0.0.0:80"
# https_listen = "0.0.0.0:443"
# local_node = "main"             # name of this machine as a node

# Where this machine's entry point runs: "external" (facaded-ingress.service, so
# updating facaded never drops traffic; what install.sh sets up) or "embedded"
# (inside facaded, simplest for development).
# ingress = "embedded"
# ingress_control = "/run/facade/ingress.sock"

# Also serve the API and web UI at this domain (from this machine, with a real certificate).
# Like [acme] email, only the starting value: `facade server set` changes it later.
# api_domain = "facade.example.com"


# Volume backups (and of the server's own database and key), in data_dir/backups.
# [backups]
# enabled = true
# every_hours = 24
# keep = 7

# Where Settings → Updates and `facade server update` get new builds of facade:
# a GitHub release that CI replaces with every build of main.
# [update]
# repository = "Sigma-studios/facade"
# release = "edge"
# url = "https://mirror.example.com/facade"   # the release's files elsewhere

# Apps and stacks with auto-deploy on: how often their source is checked when no
# webhook reports changes (with one, ten times less often).
# [auto_deploy]
# poll_secs = 180

[acme]
# enabled = true
email = "you@example.com"
# staging = true                  # test against Let's Encrypt staging first

# Alerts go to Discord; set the webhook and who to tag from the CLI:
#   facade alerts config --webhook https://discord.com/api/webhooks/… --mention @here
# With a webhook, a summary of the week before is posted every Monday at 07:00 UTC
# (`facade alerts config --weekly off` turns it off).
# [alerts]
# weekly_day = "monday"
# weekly_hour = 7                 # UTC

# Every minute the server loads each domain as a visitor would (DNS, certificate,
# entry point) for the domains' badges, availability and "site unreachable" alerts.
# [checks]
# enabled = true
# every_secs = 60
# timeout_secs = 10
# concurrency = 8
