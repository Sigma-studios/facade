[package]
name = "facade-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "facaded"
path = "src/main.rs"

[dependencies]
facade-core = { path = "../facade-core", features = ["pinned-tls"] }
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bollard = "0.21"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time"] }
parking_lot = "0.12"
rand = "0.9"
rcgen = "0.14"
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
sysinfo = "0.39"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-status"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

[features]
# A DNS provider backed by Pebble's challenge test server, for end-to-end ACME tests.
pebble-test = []
