[workspace]
resolver = "3"
members = ["crates/*"]
# The web UI only builds for wasm32 (with trunk, see crates/facade-ui).
default-members = ["crates/facade-core", "crates/facade-daemon", "crates/facade-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# The web UI is downloaded by browsers: favour size.
[profile.release.package.facade-ui]
opt-level = "z"
codegen-units = 1
